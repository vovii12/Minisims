<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10151b"><title>MiniSims</title><link rel="stylesheet" href="./styles.css?v=106"><style>.hidden{display:none!important}</style></head><body><div id="menu" class="screen"><div class="menu-card"><div class="logo">Mini<span>Sims</span></div><div class="tag">Создай свою жизнь</div><button type="button" class="menu-btn primary" id="playBtn">▶ ИГРАТЬ</button><button type="button" class="menu-btn" id="newBtn">👤 СОЗДАТЬ ПЕРСОНАЖА</button><button type="button" class="menu-btn" id="continueBtn">↻ ПРОДОЛЖИТЬ</button></div></div><div id="creator" class="screen hidden"><div class="creator-card"><div class="creator-preview"><div class="preview-body"><div class="preview-head"></div><div class="preview-hair"></div><div class="preview-shirt"></div><div class="preview-pants"></div></div></div><div><h2>Создание персонажа</h2><div class="field"><label>Имя</label><input id="nameInput" value="Владимир" maxlength="18"></div><div class="field"><label>Пол</label><div class="row"><button type="button" class="choice active" data-gender="male">Мужчина</button><button type="button" class="choice" data-gender="female">Женщина</button></div></div><div class="creator-actions"><button type="button" class="menu-btn" id="backBtn">Назад</button><button type="button" class="menu-btn primary" id="startBtn">Начать игру →</button></div></div></div></div><div id="game" class="screen hidden"><div id="viewport"></div><div id="hud"></div><div id="panels"></div><div id="toast" class="toast"></div></div><script>const $=id=>document.getElementById(id),M=$('menu'),C=$('creator'),G=$('game');function show(x){[M,C,G].forEach(e=>e.classList.add('hidden'));x.classList.remove('hidden')}let loading=false;async function enter(){show(G);if(loading)return;loading=true;try{await import('./stage1-world.js?v=106')}catch(e){console.error(e);$('viewport').innerHTML='<div style="padding:30px;color:white;font:18px system-ui">Ошибка загрузки игры: '+String(e.message||e)+'</div>'}}$('playBtn').onclick=enter;$('continueBtn').onclick=enter;$('newBtn').onclick=()=>show(C);$('backBtn').onclick=()=>show(M);$('startBtn').onclick=enter;</script></body></html>
