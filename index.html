<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MiniSims</title><link rel="stylesheet" href="./styles.css?v=110"><style>.hidden{display:none!important}.creator-preview{min-height:180px;display:grid;place-items:center}.sim{position:relative;width:54px;height:112px}.sim .head{position:absolute;left:14px;top:4px;width:27px;height:30px;border-radius:50%;background:#d39a70}.sim .hair{position:absolute;left:11px;top:0;width:33px;height:17px;border-radius:18px 18px 7px 7px;background:#30221e}.sim .neck{position:absolute;left:22px;top:31px;width:11px;height:9px;background:#d39a70}.sim .torso{position:absolute;left:10px;top:38px;width:34px;height:38px;border-radius:10px}.sim .arm{position:absolute;top:41px;width:9px;height:35px;border-radius:7px;background:#d39a70}.sim .a1{left:3px}.sim .a2{right:3px}.sim .leg{position:absolute;top:74px;width:12px;height:31px;border-radius:7px;background:#3d4650}.sim .l1{left:11px}.sim .l2{right:11px}.sim .shoe{position:absolute;top:100px;width:17px;height:7px;border-radius:7px;background:#20252b}.sim .s1{left:7px}.sim .s2{right:7px}.sim.female .torso{border-radius:10px 10px 16px 16px}.sim.female .hair{height:24px;border-radius:18px 18px 10px 10px}.simworld{position:absolute;inset:0;overflow:hidden;background:linear-gradient(#a5d9ed 0 44%,#79a86a 44%);font-family:system-ui}.simworld:before{content:"";position:absolute;left:-20%;right:-20%;top:54%;height:150px;background:#aaa69e;transform:rotate(-8deg);box-shadow:0 0 0 10px #c6c2bb}.simworld:after{content:"";position:absolute;inset:44% 0 0;background:radial-gradient(circle at 75% 20%,#5e9660 0 5%,transparent 5.5%),radial-gradient(circle at 30% 65%,#5e9660 0 6%,transparent 6.5%),radial-gradient(circle at 90% 70%,#5e9660 0 5%,transparent 5.5%)}.house{position:absolute;width:190px;height:120px;border-radius:8px;background:#e6c49e;bottom:27%;left:8%;box-shadow:0 18px 25px #0003}.house:before{content:"";position:absolute;left:-12px;top:-48px;width:214px;height:70px;background:#965e54;transform:skew(-25deg);border-radius:12px}.house i{position:absolute;top:34px;width:35px;height:40px;background:#a8d7e4;border:5px solid white}.house i:first-child{left:25px}.house i:nth-child(2){right:25px}.house b{position:absolute;bottom:8px;left:72px;font-size:12px}.h2{right:8%;left:auto;bottom:38%;background:#d7b3b7}.h2:before{background:#657d90}.park{position:absolute;right:28%;top:38%;width:170px;height:100px;border-radius:50%;background:#72a964;display:flex;align-items:center;justify-content:space-around;color:white;font-size:13px;z-index:1}.park span{font-size:34px}.park b{position:absolute;bottom:8px}.simworld #player{position:absolute;left:50%;top:67%;z-index:5;transform:translate(-50%,-100%)}.top{position:absolute;z-index:10;left:15px;right:15px;top:15px;display:flex;justify-content:space-between}.glass{background:#111b;color:#fff;border:1px solid #fff2;border-radius:16px;padding:10px 14px;backdrop-filter:blur(10px);box-shadow:0 8px 20px #0003}.glass small{display:block;opacity:.7}.money{font-weight:800}.needs{position:absolute;right:15px;top:75px;width:180px;z-index:10}.needs label{display:flex;justify-content:space-between;font-size:12px;margin-top:8px}.needs label em{font-style:normal}.needs>div{height:5px;background:#fff3;border-radius:8px;overflow:hidden}.needs i{display:block;height:100%;background:#63d28a}.mobile-controls{position:absolute;z-index:20;left:18px;bottom:25px;width:125px;height:125px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}.mobile-controls button{border:1px solid #fff3;background:#1118;color:#fff;font-size:20px;border-radius:14px}.mobile-controls #up{grid-column:2}.mobile-controls #left{grid-column:1;grid-row:2}.mobile-controls #down{grid-column:2;grid-row:3}.mobile-controls #right{grid-column:3;grid-row:2}.hint{position:absolute;z-index:20;right:15px;bottom:20px}@media(min-width:701px){.mobile-controls{display:none}}@media(max-width:700px){.needs{width:145px}.hint{display:none}.house{transform:scale(.75);transform-origin:left bottom}.h2{transform:scale(.7);transform-origin:right bottom}}</style></head><body><div id="menu" class="screen"><div class="menu-card"><div class="logo">Mini<span>Sims</span></div><div class="tag">Создай свою жизнь</div><button class="menu-btn primary" id="playBtn">▶ ИГРАТЬ</button><button class="menu-btn" id="newBtn">👤 СОЗДАТЬ ПЕРСОНАЖА</button><button class="menu-btn" id="continueBtn">↻ ПРОДОЛЖИТЬ</button></div></div><div id="creator" class="screen hidden"><div class="creator-card"><div class="creator-preview"><div id="previewChar" class="sim"><div class="hair"></div><div class="head"></div><div class="neck"></div><div class="torso" style="background:#557b9b"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="shoe s1"></div><div class="shoe s2"></div></div></div><div><h2>Создание персонажа</h2><div class="field"><label>Имя</label><input id="nameInput" value="Владимир" maxlength="18"></div><div class="field"><label>Пол</label><div class="row"><button class="choice active" data-gender="male">Мужчина</button><button class="choice" data-gender="female">Женщина</button></div></div><div class="field"><label>Одежда</label><div class="row"><button class="choice active" data-shirt="#557b9b">Повседневная</button><button class="choice" data-shirt="#9b617b">Яркая</button><button class="choice" data-shirt="#4d6658">Спорт</button></div></div><div class="creator-actions"><button class="menu-btn" id="backBtn">Назад</button><button class="menu-btn primary" id="startBtn">Начать игру →</button></div></div></div></div><div id="game" class="screen hidden"><div id="viewport"></div></div><script>const M=document.getElementById('menu'),C=document.getElementById('creator'),G=document.getElementById('game');function show(x){[M,C,G].forEach(e=>e.classList.add('hidden'));x.classList.remove('hidden')}function oldWorld(){show(G);document.getElementById('viewport').innerHTML='<div class="simworld"><div class="house h1"><i></i><i></i><b>ДОМ</b></div><div class="house h2"><i></i><i></i><b>КАФЕ</b></div><div class="park"><span>🌳</span><span>🌳</span><b>ПАРК</b></div><div id="oldplayer" class="sim" style="position:absolute;left:50%;top:67%;z-index:5"><div class="hair"></div><div class="head"></div><div class="neck"></div><div class="torso" style="background:#557b9b"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div><div class="shoe s1"></div><div class="shoe s2"></div></div><div class="top"><div class="glass"><b id="simname">Владимир</b><small>Дома · 08:00</small></div><div class="glass money">§ 2 000</div></div><div class="needs glass"><b>Потребности</b><label>Голод <em>78</em></label><div><i style="width:78%"></i></div><label>Энергия <em>91</em></label><div><i style="width:91%"></i></div><label>Общение <em>64</em></label><div><i style="width:64%"></i></div><label>Гигиена <em>86</em></label><div><i style="width:86%"></i></div></div><div class="mobile-controls"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="hint glass">WASD / стрелки · движение</div></div>';const p=document.getElementById('oldplayer'),keys={};let x=50,y=67;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function loop(){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(dx||dy){x=Math.max(8,Math.min(92,x+dx*.35));y=Math.max(40,Math.min(88,y+dy*.28));p.style.left=x+'%';p.style.top=y+'%'}requestAnimationFrame(loop)}loop()}document.getElementById('playBtn').onclick=oldWorld;document.getElementById('continueBtn').onclick=oldWorld;document.getElementById('newBtn').onclick=()=>show(C);document.getElementById('backBtn').onclick=()=>show(M);document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-gender]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('previewChar').className='sim '+b.dataset.gender});document.querySelectorAll('[data-shirt]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-shirt]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#previewChar .torso').style.background=b.dataset.shirt});</script><script src="./stage2-character.js?v=110"></script></body></html>
