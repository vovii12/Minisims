<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10151b"><title>MiniSims</title><link rel="stylesheet" href="./styles.css?v=108"><style>.hidden{display:none!important}.bootworld{position:absolute;inset:0;background:linear-gradient(#8fcce8 0 53%,#72a95f 53%);overflow:hidden}.bootworld .road{position:absolute;width:180%;height:90px;background:#777;left:-40%;top:62%;transform:rotate(-8deg);box-shadow:0 0 0 5px #999}.bootworld .house{position:absolute;width:150px;height:105px;background:#e8c7a4;border:5px solid #fff;bottom:22%;left:18%;border-radius:8px}.bootworld .roof{position:absolute;width:170px;height:80px;background:#9b6657;transform:rotate(45deg);top:-45px;left:-15px;border-radius:10px}.bootworld .tree{position:absolute;width:55px;height:55px;border-radius:50%;background:#3d7d46;box-shadow:0 35px 0 -18px #654832}.bootworld .t1{left:65%;top:30%}.bootworld .t2{left:82%;top:55%}.bootworld .t3{left:48%;top:70%}</style></head><body><div id="menu" class="screen"><div class="menu-card"><div class="logo">Mini<span>Sims</span></div><div class="tag">Создай свою жизнь</div><button type="button" class="menu-btn primary" id="playBtn">▶ ИГРАТЬ</button><button type="button" class="menu-btn" id="newBtn">👤 СОЗДАТЬ ПЕРСОНАЖА</button><button type="button" class="menu-btn" id="continueBtn">↻ ПРОДОЛЖИТЬ</button></div></div><div id="creator" class="screen hidden"><div class="creator-card"><div><h2>Создание персонажа</h2><div class="field"><label>Имя</label><input id="nameInput" value="Владимир" maxlength="18"></div><div class="field"><label>Пол</label><div class="row"><button type="button" class="choice active" data-gender="male">Мужчина</button><button type="button" class="choice" data-gender="female">Женщина</button></div></div><div class="creator-actions"><button type="button" class="menu-btn" id="backBtn">Назад</button><button type="button" class="menu-btn primary" id="startBtn">Начать игру →</button></div></div></div></div><div id="game" class="screen hidden"><div id="viewport"></div><div id="hud"></div><div id="panels"></div><div id="toast" class="toast"></div></div><script>(function(){const M=document.getElementById('menu'),C=document.getElementById('creator'),G=document.getElementById('game'),V=document.getElementById('viewport');function show(x){[M,C,G].forEach(e=>e.classList.add('hidden'));x.classList.remove('hidden')}function world(){show(G);V.innerHTML='<div class="bootworld"><div class="road"></div><div class="house"><div class="roof"></div></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div style="position:absolute;top:18px;left:18px;color:white;font:700 24px system-ui;text-shadow:0 2px 5px #000">MiniSims — этап 1</div></div>'}document.getElementById('playBtn').onclick=world;document.getElementById('continueBtn').onclick=world;document.getElementById('newBtn').onclick=function(){show(C)};document.getElementById('backBtn').onclick=function(){show(M)};document.getElementById('startBtn').onclick=world;document.querySelectorAll('[data-gender]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-gender]').forEach(function(x){x.classList.remove('active')});b.classList.add('active')}})})();</script></body></html>
