<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10151b"><title>MiniSims</title><link rel="stylesheet" href="./styles.css?v=4"><style>.screen{position:fixed;inset:0;z-index:20}.hidden{display:none!important}#menu{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#86b5ce,#e5d5bd 55%,#668d68);overflow:hidden}.menu-bg{position:absolute;inset:0;background:radial-gradient(circle at 70% 20%,#fff8,transparent 35%),linear-gradient(160deg,transparent 35%,#284b3b66)}.menu-card{position:relative;width:min(430px,90vw);padding:38px 26px 28px;border-radius:28px;background:#101923dc;border:1px solid #ffffff2b;box-shadow:0 25px 80px #0008;text-align:center;color:#fff;backdrop-filter:blur(18px)}.logo{font-size:48px;font-weight:950;letter-spacing:-2px}.logo span{color:#70d4ff}.tag{margin:10px 0 30px;color:#c6d2df}.menu-btn{width:100%;padding:15px;margin:6px 0;border-radius:15px;border:1px solid #ffffff20;background:#ffffff12;color:#fff;font-size:17px;font-weight:800;touch-action:manipulation;pointer-events:auto}.menu-btn.primary{background:linear-gradient(135deg,#62c8ff,#7279ff);border:0}.menu-btn:active{transform:scale(.98)}#creator{background:linear-gradient(135deg,#182532,#3c5265);display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;color:#fff}.creator-card{width:min(900px,96vw);display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px;border-radius:24px;background:#0d151ee8;border:1px solid #ffffff20}.creator-preview{min-height:430px;border-radius:18px;background:linear-gradient(#91b9d0,#c7b89c 58%,#60865e 59%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.preview-body{width:120px;height:290px;position:relative}.preview-head{width:105px;height:105px;border-radius:50%;background:#d59b72;position:absolute;top:0;left:8px;box-shadow:inset 0 8px #6b4129}.preview-hair{position:absolute;top:-4px;left:3px;width:115px;height:52px;border-radius:60px 60px 20px 20px;background:#39271f}.preview-shirt{position:absolute;top:98px;left:0;width:120px;height:120px;border-radius:25px 25px 8px 8px;background:#5b78a8}.preview-pants{position:absolute;top:210px;left:17px;width:86px;height:80px;background:#303a55}.field{margin:12px 0}.field label{display:block;color:#aebccc;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border-radius:11px;border:1px solid #ffffff1c;background:#ffffff0d;color:#fff}.row{display:flex;gap:8px}.choice{flex:1;padding:11px;border-radius:11px;border:1px solid #ffffff20;background:#ffffff0d;color:#fff;touch-action:manipulation}.choice.active{background:#5dbfe9}.creator-actions{display:flex;gap:8px;margin-top:18px}.creator-actions button{flex:1}@media(max-width:700px){.creator-card{grid-template-columns:1fr;padding:12px}.creator-preview{min-height:270px}.preview-body{transform:scale(.72);transform-origin:bottom center}.logo{font-size:42px}}</style></head><body><div id="menu" class="screen"><div class="menu-bg"></div><div class="menu-card"><div class="logo">Mini<span>Sims</span></div><div class="tag">Создай свою жизнь</div><button type="button" class="menu-btn primary" id="playBtn">▶ ИГРАТЬ</button><button type="button" class="menu-btn" id="newBtn">👤 СОЗДАТЬ ПЕРСОНАЖА</button><button type="button" class="menu-btn" id="continueBtn">↻ ПРОДОЛЖИТЬ</button></div></div><div id="creator" class="screen hidden"><div class="creator-card"><div class="creator-preview"><div class="preview-body"><div class="preview-head" id="pHead"></div><div class="preview-hair" id="pHair"></div><div class="preview-shirt" id="pShirt"></div><div class="preview-pants"></div></div></div><div><h2>Создание персонажа</h2><div class="field"><label>Имя</label><input id="nameInput" value="Владимир" maxlength="18"></div><div class="field"><label>Пол</label><div class="row"><button type="button" class="choice active" data-gender="male">Мужчина</button><button type="button" class="choice" data-gender="female">Женщина</button></div></div><div class="field"><label>Возраст</label><select id="ageInput"><option>Молодой взрослый</option><option>Взрослый</option><option>Пожилой</option></select></div><div class="field"><label>Кожа</label><div class="row"><button type="button" class="choice active skin" data-skin="#d59b72">Светлая</button><button type="button" class="choice skin" data-skin="#ae714d">Смуглая</button><button type="button" class="choice skin" data-skin="#70462f">Тёмная</button></div></div><div class="field"><label>Волосы</label><div class="row"><button type="button" class="choice active hair" data-hair="#39271f">Тёмные</button><button type="button" class="choice hair" data-hair="#8b5a32">Каштановые</button><button type="button" class="choice hair" data-hair="#d5c08a">Светлые</button></div></div><div class="creator-actions"><button type="button" class="menu-btn" id="backBtn">Назад</button><button type="button" class="menu-btn primary" id="startBtn">Начать игру →</button></div></div></div></div><div id="game" class="screen hidden"><div id="viewport"></div><div id="hud"></div><div id="panels"></div><div id="toast" class="toast"></div></div><script type="module" src="./game.js?v=4"></script></body></html>
