<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#10151b"><title>MiniSims</title><link rel="stylesheet" href="./styles.css?v=102"><style>.world-test{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:100;padding:12px 18px;border-radius:18px;background:rgba(16,22,28,.78);color:#fff;text-align:center;pointer-events:none}.hidden{display:none!important}</style></head><body><div id="menu" class="screen"><div class="menu-card"><div class="logo">Mini<span>Sims</span></div><div class="tag">Создай свою жизнь</div><button type="button" class="menu-btn primary" id="playBtn">▶ ИГРАТЬ</button><button type="button" class="menu-btn" id="newBtn">👤 СОЗДАТЬ ПЕРСОНАЖА</button><button type="button" class="menu-btn" id="continueBtn">↻ ПРОДОЛЖИТЬ</button></div></div><div id="creator" class="screen hidden"><div class="creator-card"><div class="creator-preview"><div class="preview-body"><div class="preview-head"></div><div class="preview-hair"></div><div class="preview-shirt"></div><div class="preview-pants"></div></div></div><div><h2>Создание персонажа</h2><div class="field"><label>Имя</label><input id="nameInput" value="Владимир" maxlength="18"></div><div class="field"><label>Пол</label><div class="row"><button type="button" class="choice active" data-gender="male">Мужчина</button><button type="button" class="choice" data-gender="female">Женщина</button></div></div><div class="field"><label>Кожа</label><div class="row"><button type="button" class="choice active skin" data-skin="#d39a70">Светлая</button><button type="button" class="choice skin" data-skin="#a96f4f">Смуглая</button><button type="button" class="choice skin" data-skin="#6f4535">Тёмная</button></div></div><div class="field"><label>Волосы</label><div class="row"><button type="button" class="choice active hair" data-hair="#30221e">Тёмные</button><button type="button" class="choice hair" data-hair="#69432d">Каштановые</button><button type="button" class="choice hair" data-hair="#b18a54">Светлые</button></div></div><div class="creator-actions"><button type="button" class="menu-btn" id="backBtn">Назад</button><button type="button" class="menu-btn primary" id="startBtn">Начать игру →</button></div></div></div></div><div id="game" class="screen hidden"><div id="viewport"></div><div id="hud"></div><div id="panels"></div><div id="toast" class="toast"></div></div><script type="module">const $=id=>document.getElementById(id),menu=$('menu'),creator=$('creator'),game=$('game');let started=false;function show(x){[menu,creator,game].forEach(e=>e.classList.add('hidden'));x.classList.remove('hidden')}async function start(){show(game);if(!started){started=true;try{await import('./stage1-world.js?v=102')}catch(e){console.error(e);alert('Ошибка загрузки игры: '+e.message)}}}$('playBtn').addEventListener('click',start);$('continueBtn').addEventListener('click',start);$('newBtn').addEventListener('click',()=>show(creator));$('backBtn').addEventListener('click',()=>show(menu));$('startBtn').addEventListener('click',start);document.querySelectorAll('[data-gender]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-gender]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));document.querySelectorAll('.skin').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.skin').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));document.querySelectorAll('.hair').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.hair').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));</script></body></html>
